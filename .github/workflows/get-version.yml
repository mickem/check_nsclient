name: Fetch version

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      version:
        description: 'Detected version'
        value: ${{ jobs.version.outputs.version }}


jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Fetch version from git tags
      id: version
      env:
        # The upstream action downloads this binary without checking its hash.
        # Review the version and checksum together when updating the tool.
        TOOL_VERSION: 2.8.7
        TOOL_SHA256: b79d77436644a9fd4c2784feea62bd893895e5469d148eb8d02b267bd340c94d
      run: |
        curl --fail --location --silent --show-error --retry 3 \
          "https://github.com/codacy/git-version/releases/download/$TOOL_VERSION/git-version" \
          --output "$RUNNER_TEMP/git-version"
        printf '%s  %s\n' "$TOOL_SHA256" "$RUNNER_TEMP/git-version" | sha256sum --check --strict -
        chmod +x "$RUNNER_TEMP/git-version"
        version="$("$RUNNER_TEMP/git-version" --release-branch main --dev-branch dev \
          --minor-identifier 'feature:' --major-identifier 'breaking:' \
          --log-paths ./ --version-prefix '')"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "New Version: $version"

