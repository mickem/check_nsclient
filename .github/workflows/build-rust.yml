name: Build Rust Client

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      version:
        type: string
        description: 'Version to build'
        required: true
    secrets:
      AZURE_TENANT_ID:
        description: 'Azure tenant ID'
        required: true
      AZURE_CLIENT_ID:
        description: 'Azure client ID'
        required: true
      AZURE_CLIENT_SECRET:
        description: 'Azure client secret'
        required: true

jobs:
  lint:
    name: Format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-lint-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-latest
            arch: x86
          # Cross-compiled from the x64 runner; see the Test step for why its
          # tests are skipped.
          - os: windows-latest
            arch: arm64
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Calculate Target
        id: target
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-*)
              echo "os_name=windows" >> $GITHUB_OUTPUT
              echo "file_ext=.exe" >> $GITHUB_OUTPUT
              case "${{ matrix.arch }}" in
                x64)   echo "triple=x86_64-pc-windows-msvc"   >> $GITHUB_OUTPUT ;;
                x86)   echo "triple=i686-pc-windows-msvc"     >> $GITHUB_OUTPUT ;;
                arm64) echo "triple=aarch64-pc-windows-msvc"  >> $GITHUB_OUTPUT ;;
                *) echo "Unknown windows arch '${{ matrix.arch }}'" ; exit 1 ;;
              esac
              ;;
            ubuntu-*)
              echo "os_name=linux" >> $GITHUB_OUTPUT
              echo "file_ext=" >> $GITHUB_OUTPUT
              # Retry helper: apt mirrors flake on hosted runners. 3 attempts, 5s/10s backoff.
              retry() {
                local n=0
                until "$@"; do
                  n=$((n+1))
                  if [ $n -ge 3 ]; then echo "::error::Failed after $n attempts: $*" >&2; return 1; fi
                  echo "::warning::Attempt $n failed; retrying in $((n*5))s..." >&2
                  sleep $((n*5))
                done
              }
              retry sudo apt-get update
              retry sudo apt-get install -y libdbus-1-dev pkg-config
              case "${{ matrix.arch }}" in
                x64)   echo "triple=x86_64-unknown-linux-gnu"  >> $GITHUB_OUTPUT ;;
                x86)
                  echo "triple=i686-unknown-linux-gnu" >> $GITHUB_OUTPUT
                  retry sudo apt-get install -y gcc-multilib
                  ;;
                arm64) echo "triple=aarch64-unknown-linux-gnu" >> $GITHUB_OUTPUT ;;
                *) echo "Unknown linux arch '${{ matrix.arch }}'" ; exit 1 ;;
              esac
              ;;
            *) echo "Unknown OS '${{ matrix.os }}'" ; exit 1 ;;
          esac

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ steps.target.outputs.triple }}

      - name: Cache dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Set Version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          # Update only this package so locked builds retain all dependency versions.
          sed -i "/^name = \"check_nsclient\"$/,/^$/s/^version = \".*\"/version = \"$VERSION\"/" Cargo.lock

      - name: Build
        run: cargo build --locked --release --target ${{ steps.target.outputs.triple }}

      - name: Test
        # Skip running tests when cross-compiling to a target that cannot run on the host
        # (e.g. building aarch64-pc-windows-msvc on an x64 Windows runner produces binaries
        # that fail with "os error 216" when executed).
        if: ${{ !(startsWith(matrix.os, 'windows-') && matrix.arch == 'arm64') && !(startsWith(matrix.os, 'ubuntu-') && matrix.arch == 'arm64') }}
        run: cargo test --locked --release --target ${{ steps.target.outputs.triple }}

      - name: Install SBOM generator
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Generate target SBOM
        shell: bash
        run: |
          # cargo-cyclonedx uses Cargo metadata with the same target and default
          # features as the build. Fail if metadata resolution changes the lockfile.
          cp Cargo.lock target/sbom-Cargo.lock
          cargo cyclonedx --format json --spec-version 1.5 \
            --target "${{ steps.target.outputs.triple }}" --override-filename check_nsclient.cdx
          cmp Cargo.lock target/sbom-Cargo.lock
          mv check_nsclient.cdx.json "target/${{ steps.target.outputs.triple }}/release/check_nsclient.cdx.json"

      - name: Sign Windows Binary
        if: startsWith(matrix.os, 'windows-')
        uses: azure/trusted-signing-action@db7a3a6bd3912025c705162fb7475389f5b69ec6 # v1.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://neu.codesigning.azure.net
          trusted-signing-account-name: nsclient
          certificate-profile-name: nsclient
          files: ${{ github.workspace }}/target/${{ steps.target.outputs.triple }}/release/check_nsclient.exe
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: check_nsclient-${{ steps.target.outputs.os_name }}-${{ matrix.arch }}
          path: |
            target/${{ steps.target.outputs.triple }}/release/check_nsclient${{ steps.target.outputs.file_ext }}
            target/${{ steps.target.outputs.triple }}/release/check_nsclient.cdx.json
          if-no-files-found: error
