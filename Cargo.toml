[package]
name = "check_nsclient"
version = "0.1.0"
authors = ["Michael Medin <michael@medin.name>"]
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive", "env"] }
reqwest = { version = "0.13.3", features = ["json", "query"] }
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10.0"
tabled = "0.20.0"
anyhow = "1.0.102"
csv = "1.4.0"
indexmap = { version = "2.14.0", features = ["serde"] }
keyring-core = "1.0.1"
async-trait = "0.1.89"
crossterm = "0.29.0"
ratatui = "0.30.0"
tui-prompts = "0.6.3"
confy = "2.0.0"
tokio-util = "0.7.18"
rpassword = "7.5.4"
# NRPE speaks TLS over a raw socket. These are the versions reqwest already
# brings in, with the same crypto provider, so the client gains no second TLS
# stack.
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-platform-verifier = "0.7.1"

# Credential stores for keyring-core, one per platform. These are the stores
# (and the lookup attributes) keyring 3.x used with the features it was built
# with here, so credentials saved by older builds are still found.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

# Secret Service over libdbus (needs libdbus-1-dev and pkg-config to build).
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[dev-dependencies]
wiremock = "0.6.5"
mockall = "0.14"
tempfile = "3.27.0"
serial_test = "3.4.0"
rcgen = { version = "0.13.2", default-features = false, features = ["aws_lc_rs", "pem"] }
